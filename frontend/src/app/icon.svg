<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="SkillGauge">
  <defs>
    <linearGradient id="skillgauge-tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="55%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#skillgauge-tile)" />
  <!-- Dial: a 220° arc, centre (32,38), radius 17 -->
  <path
    d="M16.03 43.81 A17 17 0 1 1 47.97 43.81"
    fill="none"
    stroke="#ffffff"
    stroke-width="5.2"
    stroke-linecap="round"
  />
  <!-- Needle: points at 50° (upper-right), length 15 -->
  <path
    d="M32 38 41.64 26.51"
    fill="none"
    stroke="#a5f3fc"
    stroke-width="5.2"
    stroke-linecap="round"
  />
